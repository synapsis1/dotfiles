# Mouse: wheel scrolls history, drag selects, click picks pane
set -g mouse on

# Clipboard: let tmux AND apps inside it (e.g. Claude Code) set the local clipboard via OSC 52
set -s set-clipboard on
set -g allow-passthrough on

# Terminal capabilities: truecolor, and extended keys so Shift+Enter works in Claude Code
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB:clipboard:extkeys'
set -s extended-keys on

# Quality of life
set -sg escape-time 10        # no lag after Esc
set -g history-limit 50000
set -g focus-events on
setw -g mode-keys vi          # vi keys in copy mode
